[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loadout"
version = "0.3.0"
description = "Structured inventory and trip-packing planner"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
inventory = "inventory_toolkit.cli:main"
loadout-api = "api.app:run"

[tool.setuptools]
packages = ["inventory_toolkit", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
