[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loadout"
version = "0.3.0"
description = "Structured inventory and trip-packing planner"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/metemorris/loadout"
Repository = "https://github.com/metemorris/loadout"
Issues = "https://github.com/metemorris/loadout/issues"

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "hypothesis>=6,<7"]

[project.scripts]
inventory = "inventory_toolkit.cli:main"
loadout-api = "api.app:run"

[tool.setuptools]
packages = ["inventory_toolkit", "api"]

[tool.setuptools.data-files]
"share/loadout" = [
  "data/schema.yaml",
  "data/activity_templates.yaml",
  "data/requirement_matchers.yaml",
  "data/examples/clothes.yaml",
  "data/examples/locations.yaml",
  "data/examples/trips.yaml",
  "data/examples/packing_plans.yaml",
  "data/examples/trip_executions.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not personal_data and not legacy_personal' --strict-markers --durations=10 --durations-min=0.25"
markers = [
  "unit: pure or in-memory domain tests",
  "api: API tests using an injected in-memory repository",
  "e2e: durable YAML adapter workflows",
  "property: generated domain-invariant tests",
  "personal_data: one read-only compatibility check for the local catalog",
  "legacy_personal: superseded tests coupled to one historical personal catalog",
]
