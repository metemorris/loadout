name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate the sanitized catalog
        run: |
          cp data/examples/*.yaml data/
          python -m inventory_toolkit validate
      - name: Run tests
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/loadout-wheel"
          "$RUNNER_TEMP/loadout-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/loadout-wheel/bin/inventory" validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
